// Boss "Magmus, the Cinder Mole" - 32x32, drawn procedurally
function bossArt(frame,hurt){
 return pix(32,32,(x,y)=>{
  const cx=16,cy=19,dx=(x-cx)/14.5,dy=(y-cy)/12.5,d=dx*dx+dy*dy;
  // horns
  if(y<9){const hl=Math.abs(x-7)<=(y-1)/3&&y>1, hr=Math.abs(x-24)<=(y-1)/3&&y>1;if(hl||hr)return y<4?'#fff3c0':'#e0c080'}

  if(y>=29){const fl=x>=5&&x<=12,fr=x>=19&&x<=26;const off=frame?1:0;if((fl&&y<32-off)||(fr&&y<31+off))return y===29?'#2a1414':'#3a1c1c'}
  if(d>1)return null;
  if(d>0.86)return '#1a0a0a';
  if(hurt)return (x+y)%2?'#ffffff':'#ffd0a0';
  // eyes
  if(y>=13&&y<=15&&((x>=9&&x<=12)||(x>=19&&x<=22)))return y===14&&(x===11||x===20)?'#ffffff':'#ffe14a';
  if(y===12&&((x>=8&&x<=12)||(x>=19&&x<=23)))return '#1a0a0a';
  // mouth + teeth
  if(y>=19&&y<=22&&x>=10&&x<=21){if(y===19&&x%3===0)return '#fff3e0';if(y===22&&x%3===1)return '#fff3e0';return '#2a0606'}
  // snout
  if(y>=16&&y<=18&&x>=14&&x<=17)return '#ff9a8a';
  // molten cracks
  const n=hash(x>>1,y>>1);const crack=(Math.abs(((x*3+y*5)%11)-5)<1&&n>0.45)||((x+y*2)%13===0&&n>0.6);
  if(crack&&y>9)return frame?'#ffb02a':'#ff7a1a';
  const shade=dy>0.45?'#4a2424':dy<-0.4?'#8a4a3a':'#6a3430';
  return shade});}

const COMET_COLS=['#ff5a8a','#ffd040','#50f080','#60b0ff','#c070ff'];
ART.comet=[0,1,2,3,4].map(f=>pix(16,16,(x,y)=>{ // "Comet Charm" - invincibility
 const dx=Math.abs(x-7.5),dy=Math.abs(y-7.5);const v=dx*1.15+dy*0.85;
 if(v>7.2)return null;if(v>6.2)return '#2a1440';if(v<2.2)return '#ffffff';
 return COMET_COLS[(f+((x+y)>>2))%5]}));
ART.heart=pix(16,16,(x,y)=>{ // "Clover Heart" - 1-up
 const u=(x-7.5)/6.4,v=-(y-7)/6.4;const q=Math.pow(u*u+v*v-1,3)-u*u*v*v*v;if(q>0)return null;
 const u2=(x-7.5)/5.2,v2=-(y-7)/5.2;const q2=Math.pow(u2*u2+v2*v2-1,3)-u2*u2*v2*v2*v2;
 if(q2>0)return '#0a3a14';if(x<6&&y<6)return '#c8ffc8';return y>9?'#20a040':'#3ad060'});
ART.coin=[10,7,3,7].map(w=>pix(16,16,(x,y)=>{const dx=(x-7.5)/(w/2),dy=(y-8)/6.5;const d=dx*dx+dy*dy;if(d>1)return null;if(d>0.62)return '#a06010';
 if(w>4&&Math.abs(x-7.5)<1&&y>=5&&y<=11)return '#ffe9a0';return '#ffc830'}));
ART.spark=[0,1].map(f=>pix(8,8,(x,y)=>{const dx=Math.abs(x-3.5),dy=Math.abs(y-3.5);if(f?(dx<1&&dy<4)||(dy<1&&dx<4):(Math.abs(dx-dy)<1&&dx<3.5)||(dx<1.5&&dy<1.5))return dx+dy<2?'#ffffff':'#ffd23a';return null}));
ART.fireball=[0,1].map(f=>pix(10,10,(x,y)=>{const d=Math.hypot(x-4.5,y-4.5);if(d>4.6)return null;if(d<2)return '#fff6c0';return (f^(x+y)%2)?'#ff7a1a':'#ffb02a'}));
